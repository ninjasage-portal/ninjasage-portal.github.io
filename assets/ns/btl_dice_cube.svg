<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
  <defs>
    <linearGradient id="dcStone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9CA8B0"/>
      <stop offset="50%" stop-color="#76848D"/>
      <stop offset="100%" stop-color="#525E66"/>
    </linearGradient>
    <radialGradient id="dcHole" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#1A2024"/>
      <stop offset="75%" stop-color="#0D1114"/>
      <stop offset="100%" stop-color="#384248"/>
    </radialGradient>
  </defs>
  <!-- Outer Beveled Stone Frame with 4 Corner Rivets -->
  <rect x="2" y="2" width="48" height="48" rx="7" fill="#3B4952" stroke="#11161A" stroke-width="2.2"/>
  <rect x="5" y="5" width="42" height="42" rx="5" fill="url(#dcStone)" stroke="#242E35" stroke-width="1.6"/>
  <!-- 4 Corner Rivets -->
  <circle cx="7.5" cy="7.5" r="2.6" fill="#8C99A2" stroke="#1D252B" stroke-width="1"/>
  <circle cx="44.5" cy="7.5" r="2.6" fill="#8C99A2" stroke="#1D252B" stroke-width="1"/>
  <circle cx="7.5" cy="44.5" r="2.6" fill="#8C99A2" stroke="#1D252B" stroke-width="1"/>
  <circle cx="44.5" cy="44.5" r="2.6" fill="#8C99A2" stroke="#1D252B" stroke-width="1"/>
  <!-- 6 Circular Seal Sockets around Center Dot (exact Gambar 2 pattern) -->
  <circle cx="26" cy="13.5" r="3.6" fill="url(#dcHole)" stroke="#B5C0C7" stroke-width="0.9"/>
  <circle cx="37" cy="19.5" r="3.6" fill="url(#dcHole)" stroke="#B5C0C7" stroke-width="0.9"/>
  <circle cx="37" cy="32.5" r="3.6" fill="url(#dcHole)" stroke="#B5C0C7" stroke-width="0.9"/>
  <circle cx="26" cy="38.5" r="3.6" fill="url(#dcHole)" stroke="#B5C0C7" stroke-width="0.9"/>
  <circle cx="15" cy="32.5" r="3.6" fill="url(#dcHole)" stroke="#B5C0C7" stroke-width="0.9"/>
  <circle cx="15" cy="19.5" r="3.6" fill="url(#dcHole)" stroke="#B5C0C7" stroke-width="0.9"/>
  <!-- Center Axis Pin -->
  <circle cx="26" cy="26" r="2.3" fill="#181E22" stroke="#CBD5DC" stroke-width="0.8"/>
</svg>